<style>

.modal-in img{width:100%;border-radius:10px}
.modal-in p{margin:0;font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:40}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);padding:5px;border-radius:14px;margin-block:4px 12px}
.tabs .chip{border:0;border-radius:10px;padding:9px 6px;font-weight:700;background:transparent;color:var(--muted)}
.tabs .chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.book{position:relative;width:100%;max-width:100%;aspect-ratio:4/5;perspective:2400px;touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:14px}
.half,.face{background-size:200% 100%;background-repeat:no-repeat;background-color:#e7e4df}
.half{position:absolute;top:0;bottom:0;width:50%}
.half.l{left:0;background-position:left center;border-radius:14px 0 0 14px}
.half.r{right:0;background-position:right center;border-radius:0 14px 14px 0}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.35,.1,.2,1);z-index:2}
.leaf.fwd{left:50%;transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.12),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.08))}
.book-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.book-nav span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.book-nav .btn{padding:10px 14px}
.book-nav .btn:disabled{opacity:.35;cursor:default}
.story-btn{display:block;margin:12px auto 0;padding:11px 18px;background:linear-gradient(90deg,#f9ce34,#ee2a7b 55%,#6228d7);color:#fff;border:0;font-weight:700}
.stage-hint{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}
#crowd{width:100%;max-width:100%;aspect-ratio:4/5;border-radius:14px;display:block;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.stage-actions{display:flex;justify-content:center;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.97)}}

<script>
const W=1080,H=1350;
const F_BAND='"Black Han Sans","Apple SD Gothic Neo",sans-serif';
// Pretendard is built from Inter (Latin) + Source Han Sans (Hangul = Noto Sans KR); this pair stands in for Pretendard Light
const F_PRET='"Pretendard","Inter","Noto Sans KR","Apple SD Gothic Neo",sans-serif';
const F_TK='"Oswald","Do Hyeon","Apple SD Gothic Neo",sans-serif',F_PEN='"Nanum Pen Script",cursive';const F_HAND='"Gaegu","Apple SD Gothic Neo",cursive';
const PALETTE=['#ff4f79','#ff5a2e','#2f6bff','#ffd23f','#22c08a','#8b5cf6','#ff8a3d','#111216','#f4f4f2','#7fd6ff'];
const SKINS=['#f6c3a3','#f7b8b8','#f8dc9b','#b9dcf5','#bfe6cf','#e9d3f5'];
const LETTERS=['#7ccf9a','#b5e07c','#7fb6ff','#ff9fb8','#ffb85c','#b79bff'];
const FLAGS=['#8ea0ff','#ff9fb8','#7ccf9a','#ffd23f'];
const PATTERNS=[['solid','민무늬'],['stripe','줄무늬'],['dots','도트'],['check','체크'],['holo','홀로그램'],['poster','포스터']];
let CUR_POSTER=null,DS=1.3,FLIP_P=null;
const uniq=a=>[...new Set(a)];
// colour choices taken from the poster: its colours plus a light and a deep tone of each
function posterSet(pal,fallback,mode){
  if(!pal||!pal.length)return fallback;
  const light=pal.map(c=>shade(c,.55)),deep=pal.map(c=>shade(c,-.4));
  const set=mode==='light'?[...light,...pal.filter(c=>lum(c)>.6),...pal.map(c=>shade(c,.75))]:[...pal,...light,...deep];
  return uniq(set).slice(0,15);
}
const posterImg=rec=>rec&&rec.poster?getImg({id:'po_'+rec.id,img:rec.poster}):null;
function extractPalette(img){
  const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(img,0,0,40,40);
  const d=x.getImageData(0,0,40,40).data,bk={};
  for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)<<8|(d[i+1]>>4)<<4|(d[i+2]>>4),B=bk[k]||(bk[k]={n:0,r:0,g:0,b:0});B.n++;B.r+=d[i];B.g+=d[i+1];B.b+=d[i+2]}
  const cols=Object.values(bk).map(B=>{const r=B.r/B.n,g=B.g/B.n,b=B.b/B.n,mx=Math.max(r,g,b),mn=Math.min(r,g,b);return{r,g,b,n:B.n,sat:mx?(mx-mn)/mx:0,l:(.299*r+.587*g+.114*b)/255}}).sort((a,b)=>b.n-a.n);
  const pick=[],far=(a,b)=>Math.hypot(a.r-b.r,a.g-b.g,a.b-b.b)>70,add=c=>{if(c&&pick.every(q=>far(q,c)))pick.push(c)};
  add(cols[0]);
  const vivid=c=>c.sat*Math.sqrt(c.n)*(c.l>.15&&c.l<.92?1:.15);add([...cols].sort((a,b)=>vivid(b)-vivid(a))[0]);
  for(const c of cols){if(pick.length>=5)break;add(c)}
  return pick.map(c=>'#'+[c.r,c.g,c.b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''));
}
const POSES=[['rock','🤘','락'],['peace','✌️','브이'],['point','☝️','원픽'],['five','✋','하이파이브']];
const PAPERS=[['cream','미색 노트'],['grid','모눈종이'],['kraft','크라프트지']];
const KEY='bandlog.v2';
const uid=()=>Math.random().toString(36).slice(2,9);

const TICKET_CATS=[['전시','EXHIBITION'],['콘서트','CONCERT'],['뮤지컬','MUSICAL'],['연극','PLAY'],['클래식','CLASSIC']];
const TICKET_COLORS=['#f6d05a','#ffe3d3','#f4f4f2','#cfe6ff','#d9f2c4','#ff4f79','#2f6bff','#111216'];
const TICKET_INKS=['#c8202e','#1b2b6b','#17181c','#ffffff','#ff4f79','#1f7a4d'];
const SAMPLE_TICKET={id:'ex3',sample:true,kind:'ticket',title:'빛의/정원',flag:'EXHIBITION',date:'2026-09-14',place:'예술의전당',pose:'rock',skin:'#f8dc9b',letter:'#7fb6ff',flagColor:'#ff9fb8',paper:'cream',bands:[],
  ticket:{cat:'전시',color:'#f6d05a',ink:'#1b2b6b',accent:'#ff4f79',seat:'일반 1매',no:'NO.0914',time:'14:00',cast:'미디어아트 12인',rating:4,review:'빛이 쏟아지는 방에서 한참 서 있었다',face:'photo'}};
function sample(){return[SAMPLE_TICKET,
 {id:'ex1',sample:true,title:'PEN/TA/PORT',flag:'ROCK FESTIVAL',date:'2026-08-02',place:'인천 송도',pose:'rock',skin:'#f6c3a3',letter:'#7ccf9a',flagColor:'#8ea0ff',paper:'cream',bands:[
  {id:'b1',color:'#ff5a2e',color2:'#ffd23f',pattern:'stripe',text:'1DAY 8.2'}]},
 {id:'ex2',sample:true,title:'서울/재즈/페스',flag:'JAZZ FESTA',date:'2026-05-30',place:'올림픽공원',pose:'peace',skin:'#b9dcf5',letter:'#b79bff',flagColor:'#ffd23f',paper:'grid',bands:[
  {id:'b2',color:'#8b5cf6',color2:'#7fd6ff',pattern:'holo',text:'SAT 5.30'},
  {id:'b3',color:'#111216',color2:'#ff8a3d',pattern:'stripe',text:'SUN 5.31'}]}
]}
let records;
try{records=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(records)||!records.length)records=sample();
else if(records.some(r=>r.id==='ex1')&&!records.some(r=>r.id==='ex3'))records.push(JSON.parse(JSON.stringify(SAMPLE_TICKET)));
records.forEach(r=>{if(r.kind==='ticket'&&r.ticket)r.ticket.face='photo'});
function persist(){if(cloudOn())return true;localRecords=records;try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){return false}}
let localRecords=records;
const cloudOn=()=>!!(window.TBCloud&&window.TBCloud.user);
const cloudConfigured=()=>!!(window.TBCloud&&window.TBCloud.configured);

let view='home',draft=null,animT=1;
const imgCache={};
function getImg(b){
  if(!b.img)return null;
  let c=imgCache[b.id];
  if(c&&c.src===b.img)return c.complete?c:null;
  c=new Image();if(/^https?:/.test(b.img))c.crossOrigin='anonymous';c.onload=()=>{if(view==='edit')drawAll();else if(view==='cover')paintCover();else{clearPages();home()}};c.src=b.img;imgCache[b.id]=c;return null;
}

/* ---------- helpers ---------- */
function rng(seed){let h=1779033703;for(const ch of seed)h=Math.imul(h^ch.charCodeAt(0),3432918353),h=h<<13|h>>>19;
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function lum(hex){const n=parseInt(hex.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v+(k<0?v*k:(255-v)*k))));
  return'#'+[n>>16,n>>8&255,n&255].map(f).map(v=>v.toString(16).padStart(2,'0')).join('')}
function fmtDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${y}. ${+m}. ${+dd}`}
function fitFont(ctx,text,max,size,family,weight){let s=size;do{ctx.font=`${weight||''} ${s}px ${family}`;s-=2}while(ctx.measureText(text).width>max&&s>14);}
const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);

/* ---------- wristband fabric ---------- */
function drawStrip(ctx,b,L,t,phase){
  ctx.fillStyle=b.color;ctx.fillRect(0,0,L,t);
  const c2=b.color2;

/* ---------- paper-cut hand ---------- */

/* ---------- full spread ---------- */

    document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==='close')m.remove()}};
  document.getElementById('save').onclick=async e=>{
    if(reading){toast('포스터를 읽는 중이에요. 잠시만요');return}
    const btn=e.currentTarget;if(btn.disabled)return;
    let rec=clean();delete rec.sample;
    if(cloudOn()){
      btn.disabled=true;btn.textContent='저장하는 중…';
      try{const saved=await window.TBCloud.save(rec);const i=records.findIndex(r=>r.id===rec.id||r.id===saved.id);

      catch(err){console.error(err);btn.disabled=false;btn.textContent='기록 보관하기';toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요');return}
    }else{
      const i=records.findIndex(r=>r.id===rec.id);
      if(i>=0)records[i]=rec;else records.push(rec);
      toast(persist()?'공책에 보관했어요':'이 브라우저에서는 저장이 안 돼요. 이미지로 저장해 주세요');
    }
    clearPages();homeMode='book';home({focus:rec.id})};
  syncKind();bandsUI();drawAll();
  if(!src&&!keep)setTimeout(play,250);
}

/* ---------- account & cloud hooks (cloud.js calls these) ---------- */
let cloudState='off',cloudMsg='';
const IMPORT_DONE='bandlog.imported.';
window.TBApp={
  cloudUnavailable(){cloudState='off';renderAccount()},
  cloudReady(){if(cloudState==='off')cloudState='ready';renderAccount()},
  cloudLoading(){cloudState='loading';renderAccount()},
  cloudError(m){cloudState='ready';cloudMsg=m;renderAccount();toast(m)},
  useCloud(list){cloudState='ready';records=list;pageIdx=0;clearPages();refreshHome()},
  useLocal(){cloudState='ready';records=localRecords;pageIdx=0;clearPages();refreshHome()},
};
function refreshHome(){if(view==='home')home();else renderAccount()}
function localImportable(){
  const C=window.TBCloud;if(!C||!C.user)return[];
  try{if(localStorage.getItem(IMPORT_DONE+C.user.id))return[]}catch(e){}
  return(localRecords||[]).filter(r=>!r.sample);
}
function renderAccount(){
  const a=document.getElementById('acct'),note=document.getElementById('cloudNote');if(!a)return;
  const C=window.TBCloud;
  if(!C||!C.configured){a.innerHTML='';if(note)note.innerHTML='';return}
  if(C.user){
    const name=(C.user.email||'내 계정').split('@')[0];
    a.innerHTML=`<button class="btn ghost acct-btn" id="acctBtn" type="button" aria-label="내 계정">☁ ${esc(name)}</button>`;
  }else a.innerHTML=`<button class="btn ghost acct-btn" id="acctBtn" type="button">로그인</button>`;
  document.getElementById('acctBtn').onclick=openAccount;
  if(!note)return;
  const todo=localImportable();
  if(cloudState==='loading')note.innerHTML=`<div class="note">내 기록을 불러오는 중이에요…</div>`;
  else if(todo.length)note.innerHTML=`<div class="note"><span>이 브라우저에 저장된 기록 ${todo.length}개가 있어요. 내 계정으로 옮기면 다른 기기에서도 볼 수 있어요.</span>
    <span class="note-actions"><button class="btn primary" id="importBtn" type="button">기존 기록 가져오기</button><button class="btn ghost" id="importSkip" type="button">다음에</button></span></div>`;
  else if(!C.user)note.innerHTML=`<div class="note muted">로그인하면 휴대폰이나 다른 컴퓨터에서도 같은 기록을 볼 수 있어요.</div>`;

const dotDate=d=>d?d.replace(/-/g,'.'):'';
function autoCut(title){
  const t=title.replace(/[\[\(（〈<《].*?[\]\)）〉>》]/g,' ').replace(/\s+/g,' ').trim();
  const out=[];
  for(const w of t.split(' ').slice(0,3)){
    const ko=/[가-힣]/.test(w),n=ko?(w.length===4?2:3):(w.length<=5?5:4);
    for(let i=0;i<w.length;i+=n)out.push(w.slice(i,i+n));
  }
  return out.slice(0,4).join('/')||title.slice(0,8);
}

function buildFromInfo(info){
  if(!info){if(!draft.title)draft.title='';return}
  const str=v=>typeof v==='string'?v.trim():'';
  const fest=str(info.kind)==='festival'||str(info.category)==='페스티벌';
  draft.kind=fest?'band':'ticket';
  const cat=TICKET_CATS.find(c=>c[0]===str(info.category));
  draft.name=str(info.title).slice(0,24);
  const cut=str(info.cutout);draft.title=(cut||draft.name).slice(0,20);
  draft.flag=(str(info.flag)||(fest?'MUSIC FESTIVAL':cat?cat[1]:'CONCERT')).toUpperCase().slice(0,16);
  if(/^\d{4}-\d{2}-\d{2}$/.test(str(info.date)))draft.date=str(info.date);
  draft.place=str(info.place).slice(0,16);
  draft.pose={rock:'rock',chill:'peace',cute:'peace',cheer:'five'}[str(info.vibe)]||'rock';
  draft.paper=fest?'grid':'cream';
  draft.ticket={...draft.ticket,cat:cat?cat[0]:'콘서트',time:/^\d{1,2}:\d{2}$/.test(str(info.time))?str(info.time):'',cast:str(info.cast).slice(0,20),seat:'',no:'',rating:0,review:''};
  if(fest){const days=(Array.isArray(info.days)?info.days:[]).map(str).filter(Boolean).slice(0,3);
    draft.bands=(days.length?days:['1DAY']).map(t=>({id:uid(),color:'#ff5a2e',color2:'#ffd23f',pattern:'stripe',text:t.slice(0,16)}))}
}
function colorize(){
  const pal=draft.palette||[];if(!pal.length)return;
  const sat=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?(mx-mn)/mx:0};
  const mids=pal.filter(c=>lum(c)>.22&&lum(c)<.78).sort((a,b)=>sat(b)-sat(a));
  draft.letter=mids[0]||LETTERS[0];
  const other=pal.find(c=>c!==draft.letter)||draft.letter;
  draft.flagColor=lum(other)>.6?other:shade(other,.55);
  draft.skin=shade(draft.letter,.62);
}

  if(reduced()){done();return}

}
function applyPoster(){
  const pal=draft.palette||[];if(!pal.length)return;
  const dom=pal[0],acc=pal[1]||pal[0];
  const byL=[...pal].sort((a,b)=>lum(b)-lum(a)),light=byL[0];
  const sat=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?(mx-mn)/mx:0};
  const score=c=>Math.abs(lum(light)-lum(c))+sat(c)*.5;
  let ink=pal.filter(c=>c!==light).sort((a,b)=>score(b)-score(a))[0];
  if(!ink||Math.abs(lum(light)-lum(ink))<.3)ink=lum(light)>.55?'#17181c':'#ffffff';
  draft.ticket.color=light;draft.ticket.ink=ink;draft.ticket.accent=pal.find(c=>c!==light&&c!==ink)||ink;draft.ticket.face='photo';
  if(!draft.bands.length)draft.bands.push({id:uid(),color:dom,color2:acc,pattern:'poster',text:'1DAY'});
  draft.bands.forEach((b,i)=>{if(i===0){b.pattern='poster';b.color=dom;b.color2=acc}else{b.pattern=i%2?'stripe':'dots';b.color=pal[i%pal.length];b.color2=pal[(i+1)%pal.length]}});
}
